<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnadına TV Pro</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; }
        .input-box { display: flex; gap: 5px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #333; background: #111; color: #fff; }
        button { padding: 12px; background: #e50914; border: none; color: #fff; border-radius: 5px; font-weight: bold; }
        .show-header { text-align: center; margin-bottom: 20px; }
        .show-header img { width: 100%; max-width: 300px; border-radius: 10px; }
        .ep-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .ep-item { background: #1a1a1a; padding: 15px; border-radius: 8px; text-align: center; font-size: 14px; border: 1px solid #333; }
        #player { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; }
        iframe { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 10px; right: 10px; background: red; color: #fff; padding: 10px; border-radius: 50%; z-index: 101; }
    </style>
</head>
<body>

    <div class="input-box">
        <input type="text" id="url" placeholder="Dizi Linkini Yapıştır...">
        <button onclick="loadShow()">YÜKLE</button>
    </div>

    <div id="result"></div>
    <div id="player">
        <div class="close-btn" onclick="document.getElementById('player').style.display='none'; document.querySelector('iframe').src=''; ">X</div>
        <iframe src="" allowfullscreen></iframe>
    </div>

<script>
    async function loadShow() {
        const url = document.getElementById('url').value;
        const res = await fetch(`/api/scrape?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        
        let html = `<div class="show-header">
            <img src="${data.cover}">
            <h1>${data.title}</h1>
        </div><div class="ep-list">`;
        
        data.episodes.forEach(ep => {
            html += `<div class="ep-item" onclick="play('${ep.url}')">
                S${ep.season} - B${ep.episode}
            </div>`;
        });
        
        html += `</div>`;
        document.getElementById('result').innerHTML = html;
    }

    async function play(epUrl) {
        const res = await fetch(`/api/scrape?url=${encodeURIComponent(epUrl)}&type=video`);
        const data = await res.json();
        if(data.videoUrl) {
            document.querySelector('iframe').src = data.videoUrl;
            document.getElementById('player').style.display = 'block';
        } else {
            alert("Video bulunamadı!");
        }
    }
</script>
</body>
</html>
