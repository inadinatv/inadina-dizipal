<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnadına TV - Pro v2</title>
    <style>
        :root { --main: #ff0000; --bg: #0a0a0a; --card: #161616; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #eee; margin: 0; padding: 15px; }
        .nav { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .nav-row { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; }
        button { padding: 12px 20px; background: var(--main); border: none; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .show-info { display: flex; gap: 20px; margin-bottom: 30px; align-items: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; }
        .show-info img { width: 120px; height: 180px; object-fit: cover; border-radius: 10px; border: 2px solid var(--main); }
        
        .season-box { margin-bottom: 25px; }
        .season-title { font-size: 20px; border-left: 4px solid var(--main); padding-left: 10px; margin-bottom: 15px; color: #fff; }
        .episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .episode-card { background: var(--card); padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid #222; transition: 0.2s; }
        .episode-card:hover { border-color: var(--main); transform: translateY(-3px); }
        
        #player-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        iframe { width: 100%; height: 100%; border: none; }
        .controls { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; z-index: 10000; }
        .btn-ui { padding: 10px 15px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid #fff; border-radius: 5px; cursor: pointer; }

        .loader { text-align: center; display: none; padding: 20px; color: var(--main); font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav">
        <div class="nav-row">
            <input type="text" id="urlInput" placeholder="Dizipal linkini (dizi/dizi-adi) yapıştır...">
            <button onclick="loadShow()">YÜKLE</button>
        </div>
    </div>

    <div id="loader" class="loader">VERİLER AYIKLANIYOR...</div>
    <div id="app"></div>

    <div id="player-view">
        <div class="controls">
            <button class="btn-ui" onclick="closePlayer()">✕ KAPAT</button>
            <button class="btn-ui" id="externalBtn">🔗 DIŞARIDAN AÇ</button>
        </div>
        <div id="videoContainer" style="width:100%; height:100%;"></div>
    </div>

<script>
    async function loadShow() {
        const url = document.getElementById('urlInput').value;
        if(!url) return;
        
        showLoader(true);
        const app = document.getElementById('app');
        app.innerHTML = '';

        try {
            const res = await fetch(`/api/scrape?url=${encodeURIComponent(url)}`);
            const data = await res.json();

            let html = `
                <div class="show-info">
                    <img src="${data.cover}">
                    <div>
                        <h1>${data.title}</h1>
                        <p>${data.episodes.length} Bölüm bulundu.</p>
                    </div>
                </div>
            `;

            // Sezonlara ayır
            const seasons = {};
            data.episodes.forEach(ep => {
                if(!seasons[ep.season]) seasons[ep.season] = [];
                seasons[ep.season].push(ep);
            });

            Object.keys(seasons).forEach(s => {
                html += `
                    <div class="season-box">
                        <div class="season-title">Sezon ${s}</div>
                        <div class="episode-grid">
                            ${seasons[s].map(ep => `
                                <div class="episode-card" onclick="playVideo('${ep.url}')">
                                    Bölüm ${ep.episode}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            app.innerHTML = html;
        } catch (e) {
            alert("Dizi yüklenemedi. Linki kontrol et.");
        } finally {
            showLoader(false);
        }
    }

    async function playVideo(epUrl) {
        showLoader(true);
        try {
            const res = await fetch(`/api/scrape?url=${encodeURIComponent(epUrl)}&type=video`);
            const data = await res.json();
            
            if(data.videoUrl) {
                document.getElementById('videoContainer').innerHTML = `<iframe src="${data.videoUrl}" allowfullscreen></iframe>`;
                document.getElementById('player-view').style.display = 'block';
                document.getElementById('externalBtn').onclick = () => window.open(data.videoUrl, '_blank');
            } else {
                if(confirm("Video kaynağı otomatik çekilemedi. Kaynak sayfayı yeni sekmede açmak ister misin?")) {
                    window.open(epUrl, '_blank');
                }
            }
        } catch (e) {
            alert("Video yüklenirken bir sorun oluştu.");
        } finally {
            showLoader(false);
        }
    }

    function closePlayer() {
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('videoContainer').innerHTML = '';
    }

    function showLoader(status) {
        document.getElementById('loader').style.display = status ? 'block' : 'none';
    }
</script>
</body>
</html>
